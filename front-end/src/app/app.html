<app-header
  [showMenuButton]="showSidebar"
  (menuClick)="openSidebar()">
</app-header>

<div class="flex">
  @if (showSidebar) {
    <app-sidebar
      [isOpen]="sidebarOpen"
      (close)="closeSidebar()">
    </app-sidebar>
  }

  <main class="flex-1 min-h-screen">
    <app-breadcrumb></app-breadcrumb>
    <div class="mt-6">
      <router-outlet></router-outlet>
    </div>
  </main>
</div>

<app-footer></app-footer>
